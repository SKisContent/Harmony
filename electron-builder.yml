appId: com.harmony.client
productName: Harmony
copyright: Copyright © 2026 sushil@a-sk.com

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

# The renderer/preload/main bundles are emitted to out/ by electron-vite before
# electron-builder runs; only the production dependency (ws) is pulled from
# node_modules automatically.
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.social-networking
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Unsigned build. Users on macOS must right-click > Open (or
# `xattr -dr com.apple.quarantine /Applications/Harmony.app`) the first time.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  category: Network
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
